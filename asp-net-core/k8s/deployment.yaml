apiVersion: apps/v1
kind: Deployment
metadata:
  name: asp-net-core-demo
  labels:
    app: asp-net-core-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asp-net-core-demo
  template:
    metadata:
      labels:
        app: asp-net-core-demo
    spec:
      containers:
        - name: asp-net-core-demo
          image: burakistanbullu/asp-net-core-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
